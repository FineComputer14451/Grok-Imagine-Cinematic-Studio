<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1180" role="img" aria-label="Grok Imagine Cinematic Studio v3.9.1 system architecture">
  <defs>
    <style>
      .bg { fill: #08090b; }
