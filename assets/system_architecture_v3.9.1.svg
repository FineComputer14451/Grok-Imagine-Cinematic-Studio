      .node { fill: #08090b; stroke: #23272f; stroke-width: 1; }
      .node-text { fill: #eceef2; font: 500 12px 'Segoe UI', system-ui, sans-serif; }
      .badge { fill: #181b21; stroke: #23272f; }
      .badge-text { fill: #8b919c; font: 500 11px ui-monospace, Menlo, monospace; }
      .connector { stroke: #323843; stroke-width: 1.5; }
