<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="Grok Imagine Cinematic Studio v3.9.1 production orchestration flow">
  <defs>
    <style>
      .bg { fill: #08090b; }
      .card { fill: #181b21; stroke: #23272f; stroke-width: 1.5; }
      .title { fill: #eceef2; font: 600 22px 'Segoe UI', system-ui, sans-serif; }
      .subtitle { fill: #8eb4ae; font: 500 12px 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.12em; }
      .step { fill: #8eb4ae; font: 600 11px ui-monospace, Menlo, monospace; }
      .label { fill: #eceef2; font: 600 13px 'Segoe UI', system-ui, sans-serif; }
      .detail { fill: #8b919c; font: 400 11px 'Segoe UI', system-ui, sans-serif; }
      .badge { fill: #111318; stroke: #23272f; }
      .badge-text { fill: #8b919c; font: 500 11px ui-monospace, Menlo, monospace; }
      .arrow { stroke: #323843; stroke-width: 1.5; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5c636e"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="720" rx="24"/>
  <text class="subtitle" x="40" y="42">ORCHESTRATION FLOW</text>
  <text class="title" x="40" y="72">Production pipeline · v3.9.1</text>
  <rect class="badge" x="860" y="38" width="200" height="28" rx="14"/>
  <text class="badge-text" x="882" y="56">10-stage directed path</text>

  <!-- Row 1 -->
  <g transform="translate(40,110)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">01</text>
    <text class="label" x="16" y="52">Start project</text>
    <text class="detail" x="16" y="72">Activate Studio v3.9.1</text>
  </g>
  <path class="arrow" d="M240 155 H250"/>
  <g transform="translate(260,110)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">02</text>
    <text class="label" x="16" y="52">Production Bible</text>
    <text class="detail" x="16" y="72">VIDEO_PIPELINE_SPEC 1.5</text>
  </g>
  <path class="arrow" d="M460 155 H470"/>
  <g transform="translate(480,110)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">03</text>
    <text class="label" x="16" y="52">Character DNA</text>
    <text class="detail" x="16" y="72">Extract → Lock → Inject</text>
  </g>
  <path class="arrow" d="M680 155 H690"/>
  <g transform="translate(700,110)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">04</text>
    <text class="label" x="16" y="52">Pre-production</text>
    <text class="detail" x="16" y="72">Concepts · Mood · DoP</text>
  </g>
  <path class="arrow" d="M900 155 H910"/>
  <g transform="translate(920,110)">
    <rect class="card" width="140" height="90" rx="14"/>
    <text class="step" x="16" y="28">05</text>
    <text class="label" x="16" y="52">Principal photo</text>
    <text class="detail" x="16" y="72">Sequence + specialists</text>
  </g>

  <!-- connector down -->
  <path class="arrow" d="M990 210 V250"/>

  <!-- Row 2 reverse visual leftward -->
  <g transform="translate(920,260)">
    <rect class="card" width="140" height="90" rx="14"/>
    <text class="step" x="16" y="28">06</text>
    <text class="label" x="16" y="52">Imagine handoff</text>
    <text class="detail" x="16" y="72">Validated Agent Mode</text>
  </g>
  <path class="arrow" d="M910 305 H900"/>
  <g transform="translate(700,260)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">07</text>
    <text class="label" x="16" y="52">Generate Video 1.5</text>
    <text class="detail" x="16" y="72">Native audio + physics</text>
  </g>
  <path class="arrow" d="M690 305 H680"/>
  <g transform="translate(480,260)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">08</text>
    <text class="label" x="16" y="52">Readiness gates</text>
    <text class="detail" x="16" y="72">Plate · Motion · Identity</text>
  </g>
  <path class="arrow" d="M470 305 H460"/>
  <g transform="translate(260,260)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">09</text>
    <text class="label" x="16" y="52">QA + color + polish</text>
    <text class="detail" x="16" y="72">Upscale · Face restore</text>
  </g>
  <path class="arrow" d="M250 305 H240"/>
  <g transform="translate(40,260)">
    <rect class="card" width="190" height="90" rx="14"/>
    <text class="step" x="16" y="28">10</text>
    <text class="label" x="16" y="52">Delivery</text>
    <text class="detail" x="16" y="72">Key art · Trailers</text>
  </g>

  <!-- Summary bar -->
  <rect class="card" x="40" y="400" width="1020" height="240" rx="16"/>
  <text class="subtitle" x="64" y="440">PIPELINE CONTRACT</text>
  <text class="label" x="64" y="480">Logline → Production Bible → Character DNA Lock → Physics-Aware Sequences</text>
  <text class="label" x="64" y="508">→ Color Grade → AI Polish → Delivery</text>
  <text class="detail" x="64" y="548">Identity Continuity Protocol · Imagine Agent Mode Handoff · Readiness Gates</text>
  <text class="detail" x="64" y="572">Grok 4.5 primary + Grok 4.3 1M context · Native Imagine Video 1.5 with audio</text>
  <text class="detail" x="64" y="596">studio_core shared by CLI · Streamlit · NiceGUI · React · FastAPI</text>
  <text class="badge-text" x="64" y="640">Grok Imagine Cinematic Studio v3.9.1 · Independent community project · Not affiliated with xAI</text>
</svg>
