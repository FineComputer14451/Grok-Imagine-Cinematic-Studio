name: Cinematic Multi-Agent Workflow CI (v3.6)

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'agents/**'
      - '.grok/skills/**'
      - 'references/**'
      - 'web_ui/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - 'agents/**'
      - '.grok/skills/**'
      - 'references/**'
      - 'web_ui/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'Validation level'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - strict
          - full

env:
  VALIDATION_MODE: ${{ github.event.inputs.validation_mode || 'standard' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      directories_ok: ${{ steps.check_dirs.outputs.directories_ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        continue-on-error: true
        with:
          globs: '**/*.md'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Tools
        run: pip install pyflakes --quiet

      # ============================================================
      # DIRECTORY EXISTENCE CHECK WITH CACHING
      # ============================================================
      - name: Check Required Directories
        id: check_dirs
        run: |
          echo "🔍 Checking required directories..."
          MISSING_DIRS=""
          DIRECTORIES_OK="true"

          for dir in references/agents .grok/skills tools web_ui; do
            if [ ! -d "$dir" ]; then
              echo "::warning::Missing directory: $dir"
              MISSING_DIRS="$MISSING_DIRS $dir"
              DIRECTORIES_OK="false"
            else
              echo "✅ $dir exists"
            fi
          done

          if [ "$DIRECTORIES_OK" = "false" ]; then
            echo "::warning::One or more required directories are missing:$MISSING_DIRS"
          fi

          # Set output for downstream steps
          echo "directories_ok=$DIRECTORIES_OK" >> $GITHUB_OUTPUT

      # ============================================================
      # ROLE CARD & AGENT VALIDATION (v3.6 compatible)
      # ============================================================
      - name: Role Card & Agent Validation
        if: steps.check_dirs.outputs.directories_ok == 'true' || env.VALIDATION_MODE != 'standard'
        run: |
          echo "🔍 Validating Role Cards and Agents (Mode: $VALIDATION_MODE)"
          echo "============================================================"

          if [ "${{ steps.check_dirs.outputs.directories_ok }}" != "true" ]; then
            echo "::warning::Running validation despite missing directories (mode: $VALIDATION_MODE)"
          fi

          if [ -d "references/agents" ]; then
            ROLE_CARDS=$(find references/agents -name "*.md" ! -name "*INDEX*" -type f | wc -l)
            echo "📋 Found $ROLE_CARDS Role Cards in references/agents/"
          else
            echo "❌ references/agents/ directory missing"
            exit 1
          fi

          STRUCTURE_ISSUES=0
          for card in $(find references/agents -name "*.md" ! -name "*INDEX*" -type f); do
            name=$(basename "$card" .md)
            if ! grep -q "Core Mission" "$card" || ! grep -qE 'v3\.(5|6)' "$card"; then
              echo "⚠️  $name: Missing 'Core Mission' or v3.5/v3.6 section"
              STRUCTURE_ISSUES=$((STRUCTURE_ISSUES+1))
            fi
          done

          if [ $STRUCTURE_ISSUES -gt 0 ]; then
            echo "⚠️  Found $STRUCTURE_ISSUES Role Cards with structural issues"
          else
            echo "✅ All Role Cards have basic required sections"
          fi

          VERSION_ISSUES=0
          for dir in agents references/agents .grok/skills; do
            if [ -d "$dir" ]; then
              for f in $(find "$dir" -name "*.md" -o -name "*.txt" 2>/dev/null); do
                if ! grep -qE 'v3\.(5|6)' "$f" 2>/dev/null; then
                  VERSION_ISSUES=$((VERSION_ISSUES+1))
                fi
              done
            fi
          done
          echo "🔖 Files missing v3.5/v3.6 tag: $VERSION_ISSUES"

          DOC_WARNINGS=0
          for doc in README.md Quick_Start_Guide.md CHANGELOG.md MASTER_PROMPT_v3.6.md; do
            if [ ! -f "$doc" ]; then
              echo "⚠️  Missing documentation: $doc"
              DOC_WARNINGS=$((DOC_WARNINGS+1))
            fi
          done

          FAIL=false
          if [ "$VALIDATION_MODE" = "strict" ]; then
            if [ $STRUCTURE_ISSUES -gt 2 ] || [ $VERSION_ISSUES -gt 8 ]; then
              FAIL=true
            fi
          elif [ "$VALIDATION_MODE" = "full" ]; then
            if [ $STRUCTURE_ISSUES -gt 0 ] || [ $VERSION_ISSUES -gt 3 ]; then
              FAIL=true
            fi
          else
            if [ $STRUCTURE_ISSUES -gt 5 ]; then
              FAIL=true
            fi
          fi

          if $FAIL; then
            echo "❌ Validation failed (mode: $VALIDATION_MODE)"
            exit 1
          fi

          echo "✅ Role Card & Agent validation passed"

      # ============================================================
      # PYTHON & CORE FILES
      # ============================================================
      - name: Python Syntax & Core Files
        if: steps.check_dirs.outputs.directories_ok == 'true' || env.VALIDATION_MODE != 'standard'
        run: |
          echo "🐍 Checking Python files..."
          python -m py_compile tools/cinematic_studio_cli.py web_ui/app.py 2>/dev/null || echo "⚠️  Python check completed with warnings"

          for f in MASTER_PROMPT_v3.6.md tools/cinematic_studio_cli.py web_ui/app.py; do
            if [ -f "$f" ]; then
              echo "✅ $f present"
            else
              echo "❌ Missing critical file: $f"
              exit 1
            fi
          done

      # ============================================================
      # SUMMARY
      # ============================================================
      - name: Summary
        if: always()
        run: |
          echo "## 🎬 Cinematic CI Results (v3.6)" >> $GITHUB_STEP_SUMMARY
          echo "Directories OK: ${{ steps.check_dirs.outputs.directories_ok }}" >> $GITHUB_STEP_SUMMARY
          echo "Validation completed." >> $GITHUB_STEP_SUMMARY
