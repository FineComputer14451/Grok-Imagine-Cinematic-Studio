# Auto re-pin marketplace catalog after content lands on main.
#
# Protocol (cannot embed a commit's own hash in marketplace.json):
#   1. Content commit(s) land on main
#   2. This workflow: plugin catalog pin → commit only .grok-plugin/**
#   3. Release pin points at the content revision; tip is pin-only
#
# Pushes made with GITHUB_TOKEN do not re-trigger workflows, so after a
# successful pin we explicitly dispatch the main CI workflow on main tip.
name: Auto re-pin plugin catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-repin-plugin-catalog-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  repin:
    runs-on: ubuntu-latest
    # Avoid fighting intentional manual pins / bot pin commits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, '[auto-pin]') &&
        !contains(github.event.head_commit.message, 're-pin catalog to HEAD')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Need a token that can push to main (default GITHUB_TOKEN is fine
          # unless branch protection requires a different actor).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CLI dependencies
        run: pip install -r requirements.txt --quiet

      - name: Check release pin
        id: pin_status
        run: |
          set +e
          PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}" \
            python3 -m tools.cinematic_studio_cli plugin catalog check --release
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "needs_pin=false" >> "$GITHUB_OUTPUT"
            echo "Release pin already valid — nothing to do."
          else
            echo "needs_pin=true" >> "$GITHUB_OUTPUT"
            echo "Release pin stale — will re-pin to HEAD."
          fi

      - name: Pin marketplace to HEAD
        if: steps.pin_status.outputs.needs_pin == 'true'
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}" \
            python3 -m tools.cinematic_studio_cli plugin catalog pin

      - name: Commit pin-only catalog files
        id: commit
        if: steps.pin_status.outputs.needs_pin == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only catalog artifacts — never mix content into the pin tip.
          git add \
            .grok-plugin/marketplace.json \
            .grok-plugin/plugin-index.json \
            .grok-plugin/plugin.json \
            .grok-plugin/packs/*/plugin.json \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Pin reported stale release state but produced no .grok-plugin changes"
            exit 1
          fi

          # Refuse if anything outside .grok-plugin staged (safety net).
          bad=$(git diff --staged --name-only | grep -v '^\.grok-plugin/' || true)
          if [ -n "$bad" ]; then
            echo "::error::Refusing to commit non-catalog paths:"
            echo "$bad"
            exit 1
          fi

          git commit -m "$(cat <<'EOF'
          chore(plugins): re-pin catalog to HEAD [auto-pin]

          Automated pin-only follow-up so marketplace install SHA tracks the
          content revision on main. Generated by auto-repin-plugin-catalog.yml.
          EOF
          )"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push pin commit
        if: steps.commit.outputs.committed == 'true'
        run: |
          git push origin HEAD:main

      - name: Verify release pin on tip
        if: steps.commit.outputs.committed == 'true'
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}" \
            python3 -m tools.cinematic_studio_cli plugin catalog check --release

      - name: Dispatch main CI on tip
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GITHUB_TOKEN pushes do not re-trigger workflows; kick CI explicitly.
          gh workflow run "cinematic-agent-workflow-ci.yml" --ref main
          echo "Dispatched Cinematic Multi-Agent Workflow CI on main tip."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Auto re-pin plugin catalog"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Needs pin: \`${{ steps.pin_status.outputs.needs_pin || 'n/a' }}\`"
            echo "- Committed: \`${{ steps.commit.outputs.committed || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
