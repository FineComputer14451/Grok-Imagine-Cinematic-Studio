# Grok Build custom NSFW model presets — Grok Imagine Cinematic Studio
#
# These are picker aliases for NSFW / ErosForge *orchestration* sessions.
# They wrap official xAI chat models (grok-4.5 / grok-4.3) with role-tuned
# sampling. They do NOT replace Imagine generation models:
#   stills  → grok-imagine-image / grok-imagine-image-quality
#   video   → grok-imagine-video / grok-imagine-video-1.5
#
# Install into user config (models only load from ~/.grok/config.toml):
#   bash scripts/install_nsfw_grok_models.sh
# Or merge the [model.*] blocks below by hand, then:
#   grok models
#   /model erosforge-director
#
# Opt-in only. Activate with ACTIVATE EROSFORGE before intimate production.
# Uses session auth via cli-chat-proxy (SuperGrok / grok login). Avoids paid api.x.ai credits.

# ---------------------------------------------------------------------------
# ErosForge Director — primary intimate scene direction
# High creativity for emotion, consent framing, and 1.5 intimacy physics.
# ---------------------------------------------------------------------------
[model.erosforge-director]
model = "grok-4.5"
base_url = "https://cli-chat-proxy.grok.com/v1"
name = "ErosForge Director"
description = "NSFW cinematic director — intimate scene design, emotion, consent, 1.5 physics"
context_window = 500000
temperature = 0.92
top_p = 0.95
max_completion_tokens = 16384
api_backend = "responses"

