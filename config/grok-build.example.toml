# Grok Build configuration for Grok Imagine Cinematic Studio v3.7.1
# Copy to ~/.grok/config.toml and adjust as needed
#
# Unified chat stack:
#   - Cinematic orchestration + Grok Build / coding: grok-4.5 (default)
#   - Optional 1M-context Bibles: grok-4.3 (--chat-model grok-4.3)
# Min recommended CLI: 0.2.93 (`grok --version`)

[models]
default = "grok-4.5"

[ui]
# Secondary model for code/skills work when forking from creative sessions
fork_secondary_model = "grok-build"

# Optional: register 1M-context model for picker / API-key routing
[model."grok-4.3"]
model = "grok-4.3"
base_url = "https://api.x.ai/v1"
name = "Grok 4.3"
description = "Optional 1M-context Production Bibles (opt-in)"
context_window = 1000000
env_key = "XAI_API_KEY"
api_backend = "chat_completions"

# Cinematic Studio model stack (reference)
# Orchestration default: grok-4.5
# Long context (opt-in): grok-4.3
# Build / coding: grok-4.5 (aliases: grok-build-latest, grok-4.5-latest, cinematic)
# Video: grok-imagine-video (1.0 default) or grok-imagine-video-1.5 (native audio)
# Legacy coding API: grok-build-0.1 (prefer grok-4.5)
