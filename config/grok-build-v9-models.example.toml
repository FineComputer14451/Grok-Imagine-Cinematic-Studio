# Grok Build v9-4p5 / Auto specialist picker presets — Grok Imagine Cinematic Studio
#
# Full picker surface for Model Layer v4.5. Native api.x.ai may not expose
# grok-v9-4p5-* product IDs; every entry wraps grok-4.5 via cli-chat-proxy
# (session auth / SuperGrok). Not Imagine generators.
#
# Install:
#   bash scripts/install_v9_grok_models.sh
#   bash scripts/install_v9_grok_models.sh --force
# Then:
#   grok models
#   /model grok-v9
#   /model chat-expert
#   /model multi
#
# Registry: tools/models.py → GROK_BUILD_V9_MODELS · XAI_CHAT_MODELS
# Docs: references/agents/MODEL_LAYER_v4.5.md

# =============================================================================
# Chat Expert (craft) — DNA, hero prompts, DoP, QA, Identity Lock, Sonic
# T=0.55 · family shorts + registry aliases all land here
# =============================================================================

[model.grok-v9-4p5-chat-expert]
model = "grok-4.5"
base_url = "https://cli-chat-proxy.grok.com/v1"
name = "Grok v9 4.5 Chat Expert"
description = "Specialist craft — DNA, hero prompts, DoP, QA (base grok-4.5 · high reasoning)"
context_window = 500000
temperature = 0.55
top_p = 0.90
max_completion_tokens = 16384
api_backend = "responses"

